name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
          # Placeholders — real deploy uses Railway vars. Enough for prisma generate + next build + Clerk bundles.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: npm run build
